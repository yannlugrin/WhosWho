name: Package and release

on:
  push:
    tags:
      # A version (1.2.3) or a pre-release (1.2.3-beta.1).
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
      # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion
      # The packager uses the whole changelog for CurseForge and the GitHub release: keep only this version's section.
      - name: Keep this version's changelog
        run: |
          version="$GITHUB_REF_NAME"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > CHANGELOG-VERSION.md
          if ! grep -q '[^[:space:]]' CHANGELOG-VERSION.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          mv CHANGELOG-VERSION.md CHANGELOG.md
      - uses: BigWigsMods/packager@v2
